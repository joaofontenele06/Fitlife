<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitLife — Taxa Metabólica Basal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <div class="brand"><i class="fa-solid fa-heart-pulse"></i> FitLife</div>
      <nav class="main-nav">
        <a href="../index.html">Início</a>
        <a href="imc.html">IMC</a>
        <a href="tmb.html" class="active">TMB</a>
        <a href="water.html">Hidratação</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header">
      <span class="eyebrow">Ferramenta</span>
      <h1>Taxa Metabólica Basal</h1>
      <p>Estime, pela fórmula de Harris-Benedict, quantas calorias seu corpo
        gasta em repouso absoluto.</p>
    </div>

    <div class="tool-layout">
      <div class="card">
        <form id="tmb-form" novalidate>
          <div class="field">
            <label>Sexo biológico</label>
            <div class="radio-group">
              <label><input type="radio" name="sexo" value="masculino" checked /><span>Masculino</span></label>
              <label><input type="radio" name="sexo" value="feminino" /><span>Feminino</span></label>
            </div>
          </div>

          <div class="field">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1" min="1" max="500" placeholder="Ex: 70" />
            <div class="error-msg" id="erro-peso"></div>
          </div>

          <div class="field">
            <label for="altura">Altura (cm)</label>
            <input type="number" id="altura" step="0.1" min="30" max="250" placeholder="Ex: 175" />
            <div class="error-msg" id="erro-altura"></div>
          </div>

          <div class="field">
            <label for="idade">Idade (anos)</label>
            <input type="number" id="idade" step="1" min="10" max="120" placeholder="Ex: 28" />
            <div class="error-msg" id="erro-idade"></div>
          </div>

          <button type="submit" class="btn">Calcular TMB</button>
        </form>
      </div>

      <div class="card result-card" id="result-card">
        <p class="placeholder">Preencha o formulário para ver seu resultado.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Feito com <i class="fa-solid fa-heart"></i> para praticar HTML, CSS e JavaScript puros.
  </footer>

  <script src="../js/tmb.js"></script>
</body>
</html>
