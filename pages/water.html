<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitLife — Controle de Hidratação</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/water.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <div class="brand"><i class="fa-solid fa-heart-pulse"></i> FitLife</div>
      <nav class="main-nav">
        <a href="../index.html">Início</a>
        <a href="imc.html">IMC</a>
        <a href="tmb.html">TMB</a>
        <a href="water.html" class="active">Hidratação</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header">
      <span class="eyebrow">Ferramenta</span>
      <h1>Controle de Hidratação</h1>
      <p>Registre a água que você bebe ao longo do dia. Meta padrão: 2500&nbsp;ml.</p>
    </div>

    <div class="water-layout">
      <div class="card water-ring-card">
        <div class="water-ring-wrap">
          <svg viewBox="0 0 200 200">
            <circle class="ring-track-water" cx="100" cy="100" r="86" />
            <circle class="ring-progress-water" id="ring-progress" cx="100" cy="100" r="86" />
          </svg>
          <div class="water-ring-center">
            <span class="amount" id="amount-label">0 ml</span>
            <span class="goal" id="goal-label">meta: 2500 ml</span>
          </div>
        </div>
        <p class="water-status" id="status-msg">Vamos começar a se hidratar!</p>
      </div>

      <div class="card">
        <div class="water-buttons">
          <button class="water-btn" data-ml="200">+200 ml</button>
          <button class="water-btn" data-ml="300">+300 ml</button>
          <button class="water-btn" data-ml="500">+500 ml</button>
        </div>

        <div class="water-custom">
          <input type="number" id="custom-ml" min="1" max="3000" placeholder="Outra quantidade (ml)" />
          <button class="btn" id="add-custom" style="width:auto; padding:0.7rem 1.2rem;">Adicionar</button>
        </div>

        <button class="water-reset" id="reset-btn">Reiniciar dia</button>

        <div class="water-log" style="margin-top:1.5rem;">
          <h3>Registros de hoje</h3>
          <ul id="log-list">
            <li class="empty">Nenhum registro ainda.</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Feito com <i class="fa-solid fa-heart"></i> para praticar HTML, CSS e JavaScript puros.
  </footer>

  <script src="../js/water.js"></script>
</body>
</html>
