<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitLife — Calculadora de IMC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <div class="brand"><i class="fa-solid fa-heart-pulse"></i> FitLife</div>
      <nav class="main-nav">
        <a href="../index.html">Início</a>
        <a href="imc.html" class="active">IMC</a>
        <a href="tmb.html">TMB</a>
        <a href="water.html">Hidratação</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header">
      <span class="eyebrow">Ferramenta</span>
      <h1>Calculadora de IMC</h1>
      <p>Informe seu peso e altura para descobrir seu Índice de Massa Corporal
        e sua classificação.</p>
    </div>

    <div class="tool-layout">
      <div class="card">
        <form id="imc-form" novalidate>
          <div class="field">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1" min="1" max="500" placeholder="Ex: 70" />
            <div class="error-msg" id="erro-peso"></div>
          </div>

          <div class="field">
            <label for="altura">Altura (cm)</label>
            <input type="number" id="altura" step="0.1" min="30" max="250" placeholder="Ex: 175" />
            <div class="error-msg" id="erro-altura"></div>
          </div>

          <button type="submit" class="btn">Calcular IMC</button>
        </form>
      </div>

      <div class="card result-card" id="result-card">
        <p class="placeholder">Preencha o formulário para ver seu resultado.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Feito com <i class="fa-solid fa-heart"></i> para praticar HTML, CSS e JavaScript puros.
  </footer>

  <script src="../js/imc.js"></script>
</body>
</html>
